# sls-local-start.yml - Run inbox-zero using shared local Docker services
#
# Prerequisites:
#   1. Start shared services: cd D:\projects\docker-services && docker compose --profile postgres --profile redis up -d
#   2. Create the database:  docker exec -it shared-postgres createdb -U root inboxzero
#   3. Build the image:      pnpm docker:local:build
#   4. Configure:            apps/web/.env
#   5. Set POSTGRES_PASSWORD in docker/.env.sls-local
#
# Usage:
#   docker compose --env-file docker/.env.sls-local -f docker/sls-local-start.yml up -d
#   docker compose --env-file docker/.env.sls-local -f docker/sls-local-start.yml down
#   docker compose --env-file docker/.env.sls-local -f docker/sls-local-start.yml logs -f

networks:
  local-sls:
    external: true

services:
  web:
    image: ${FULL_IMAGE:-ghcr.io/elie222/inbox-zero}:latest
    container_name: inbox-zero-web
    env_file:
      - ../apps/web/.env
    environment:
      DATABASE_URL: postgresql://root:${POSTGRES_PASSWORD}@shared-postgres:5432/${POSTGRES_DB:-inboxzero}?schema=public
      DIRECT_URL: postgresql://root:${POSTGRES_PASSWORD}@shared-postgres:5432/${POSTGRES_DB:-inboxzero}?schema=public
      UPSTASH_REDIS_URL: http://shared-redis-http:80
      REDIS_URL: redis://shared-redis:6379
      INTERNAL_API_URL: http://inbox-zero-web:3000
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: ${NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS:-true}
      NEXT_PUBLIC_EMAIL_SEND_ENABLED: ${NEXT_PUBLIC_EMAIL_SEND_ENABLED:-true}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - local-sls
    restart: unless-stopped

  cron:
    image: alpine:latest
    container_name: inbox-zero-cron
    command: >
      sh -c "
        apk add --no-cache curl &&
        (
          while true; do
            echo \"[cron] Processing scheduled actions...\"
            curl -s -X GET 'http://inbox-zero-web:3000/api/cron/scheduled-actions' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: scheduled-actions request failed\"
            sleep 900
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing automation jobs...\"
            curl -s -X GET 'http://inbox-zero-web:3000/api/cron/automation-jobs' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: automation-jobs request failed\"
            sleep 900
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing follow-up reminders...\"
            curl -s -X GET 'http://inbox-zero-web:3000/api/follow-up-reminders' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: follow-up-reminders request failed\"
            sleep 3600
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing digest emails...\"
            curl -s -X GET 'http://inbox-zero-web:3000/api/resend/digest/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: digest request failed\"
            sleep 1800
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing meeting briefs...\"
            curl -s -X GET 'http://inbox-zero-web:3000/api/meeting-briefs' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: meeting-briefs request failed\"
            sleep 900
          done
        ) &
        (
          while true; do
            echo \"[cron] Renewing email watches...\"
            curl -s -X GET 'http://inbox-zero-web:3000/api/watch/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: watch request failed\"
            sleep 21600
          done
        ) &
        wait
      "
    env_file:
      - ../apps/web/.env
    depends_on:
      - web
    networks:
      - local-sls
    restart: unless-stopped
